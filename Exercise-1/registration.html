<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACE Book Store - Login</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/footer.css">
    <link rel="stylesheet" href="./assets/css/login.css">
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.png">
</head>

<body>
    <header>
        <div class="logo">
            <img src="./assets/images/white_logo.png" alt="Logo" class="logo-image">
        </div>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html"><img src="assets/images/white_cart.png" alt=""></a>
        </nav>

    </header>
    <section class="home_bg">
        <div class="container">
            <div class="card">
                <h2>Register </h2>
                <form action="/login.html">
                    <div class="form-group">
                        <!-- <label for="email">Email:</label> -->
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email">
                    </div>
                    <div class="form-group">
                        <!-- <label for="password">Password:</label> -->
                        <input type="password" class="form-control" id="password" placeholder="Password"
                            name="password">
                    </div>
                    <button type="submit">Register</button>
                </form>
            </div>
        </div>
    </section>
    <footer>
        <div class="container">
            <div class="footer">
                <div class="social_media">
                    <a href="#"><img src="./assets/images/facebook.png" alt="Facebook"></a>
                    <a href="#"><img src="./assets/images/twitter.png" alt="Twitter"></a>
                    <a href="#"><img src="./assets/images/instagram.png" alt="Instagram"></a>
                </div>
                <p>&copy; 2023 ACE Book Store. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>

</html>
