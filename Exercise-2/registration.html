<!DOCTYPE html>
<html lang="en">

<head>
    <title>Ace Online Book-store/Registration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
     <link rel="stylesheet" href="assets/css/style.css"> 
</head>

<body>
    <!--============================= Navgation bar starts=============================-->
    <nav class="navbar navbar-expand-sm">
        <div class="container-fluid justify-content-between">
            <a class="navbar-brand" href="#"> <img src="./assets/images/white_logo.png" alt="Logo"
                    class="logo-image"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="Registration.html">Registration</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Catalogue.html">Catalogue</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html"><img src="assets/images/white_cart.png" alt=""></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--============================= Navgation bar End=============================-->
    <section class="section">
        <div class="container">
            <div class="row align-items-center justify-content-center">
                <div class="col-lg-5">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="mb-3 text-center">Registration </h4>
                            <form action="/registration.html">
                                <div class="form-group mb-3">
                                    <!-- <label for="email">Email:</label> -->
                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="Email">
                                </div>
                                <div class="form-group mb-3">
                                    <!-- <label for="password">Password:</label> -->
                                    <input type="password" class="form-control" id="password" placeholder="Password"
                                        name="password">
                                </div>
                                <div class="form-group mb-3">
                                    <!-- <label for="password">Password:</label> -->
                                    <input type="tel" class="form-control" placeholder="Enter Mobile" name="TEL">
                                </div>
                                <input type="submit" class="btn btn-primary w-100" value="Register">
                                <p class="mt-3 text-center">Already have an account <a href="login.html">Login here</a></p>
                            </form>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </section>
     <!--====================== footer starts ======================-->
    <footer class="bg-dark p-3">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-lg-4 col-md-5 col-12">
                    <div class="social_media d-flex gap-3 mb-2">
                        <a href="#"><img src="./assets/images/facebook.png" alt="Facebook"></a>
                        <a href="#"><img src="./assets/images/twitter.png" alt="Twitter"></a>
                        <a href="#"><img src="./assets/images/instagram.png" alt="Instagram"></a>
                    </div>
                </div>
                <div class="col-lg-8  col-md-7 col-12">
                    <p class="text-white text-end mb-0">&copy; 2023 ACE Book Store. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>
    <!--====================== footer starts ======================-->
</body>

</html>
